<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACCESS DENIED</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #ff3e3e;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }

        .container {
            border: 2px solid #ff3e3e;
            padding: 50px;
            box-shadow: 0 0 20px #ff3e3e;
        }

        h1 {
            font-size: 5rem;
            margin: 0;
            letter-spacing: 10px;
            text-transform: uppercase;
            animation: blink 0.8s infinite;
        }

        h2 {
            font-size: 1.5rem;
            color: #ffffff;
            margin-top: 10px;
            font-weight: lighter;
        }

        p {
            color: #888;
            margin-top: 30px;
            font-size: 1rem;
        }

        .glitch-box {
            background: #ff3e3e;
            color: #000;
            padding: 5px 15px;
            font-weight: bold;
            margin-top: 20px;
            display: inline-block;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.1; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>BUSTED</h1>
        <h2>"So predictable."</h2>
        
        <div class="glitch-box">GAME OVER</div>

        <p>
            Nice try, but your quest ends here.<br>
            Close this tab and get back to work before the Boss (your teacher) arrives.
        </p>
    </div>

</body>
</html>
